<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin - SIDOTI</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <header id="navbar"></header>

  <!-- Main content: centered card -->
  <div style="
    background: var(--bg-page);
    min-height: calc(100vh - 80px - 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  ">
    <div class="card" style="
      max-width: 480px;
      width: 100%;
      padding: 32px;
    ">
      <!-- Heading -->
      <div style="text-align: center; margin-bottom: 32px;">
        <h1 style="font-size: 28px;">Login Admin</h1>
        <p style="font-size: 14px; color: var(--slate); line-height: 1.6; margin-top: 8px;">
          Khusus pengurus dan pengelola panti asuhan.
        </p>
      </div>

      <!-- Alert Box -->
      <div id="alert-box" style="margin-bottom: 16px;"></div>

      <!-- Form Login -->
      <form id="form-admin-login">
        <div class="form-group">
          <label for="email">Email Admin</label>
          <div class="input-wrapper with-left-icon">
            <svg class="input-icon left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
            </svg>
            <input
              type="email"
              id="email"
              placeholder="admin@sidoti.local"
              required
              autocomplete="email"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper with-left-icon">
            <svg class="input-icon left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              type="password"
              id="password"
              placeholder="Masukkan password"
              required
              autocomplete="current-password"
              minlength="6"
            />
          </div>
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary lg">Masuk</button>
      </form>

      <!-- Info Alert -->
      <div style="
        background: var(--primary-tint);
        border-radius: var(--radius-md);
        padding: 12px 16px;
        margin: 20px 0;
        font-size: 13px;
        color: var(--primary);
      ">
        <strong>Catatan:</strong> Akun admin dibuat manual oleh pengelola. Donatur tidak bisa mendaftar menjadi admin.
      </div>

      <!-- Link ke donor login -->
      <p style="text-align: center; font-size: 13px; color: var(--slate); margin-top: 20px;">
        Donatur? <a href="/login.html" style="color: var(--primary); font-weight: 600;">Login di sini</a>
      </p>
    </div>
  </div>

  <footer class="footer" style="margin-top: 40px;">
    <div class="container">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div class="footer-left">© 2026 SIDOTI. Bersama, hadirkan lebih banyak kebaikan.</div>
        <div class="footer-right">
          <a href="#" class="footer-link">Kebijakan Privasi</a>
          <a href="#" class="footer-link">Hubungi Kami</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/admin/login.js"></script>
</body>
</html>
