# =====================================================
# SIDOTI - Konfigurasi Netlify
# =====================================================

[build]
  # Tidak ada build step (vanilla HTML/CSS/JS)
  publish = "."

# Bersihkan URL: /admin -> /admin/
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# Dukung rute path-style dari rancangan: /pembayaran/:id -> /pembayaran.html?id=:id
[[redirects]]
  from = "/pembayaran/:id"
  to = "/pembayaran.html?id=:id"
  status = 200
