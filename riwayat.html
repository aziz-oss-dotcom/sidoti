<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwayat Donasi - SIDOTI</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <header id="navbar"></header>

  <!-- Page Header -->
  <section style="background: var(--bg-page); padding: 32px 0; border-bottom: 1px solid var(--border);">
    <div class="container" style="max-width: 1100px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0;">
        <div>
          <h1 style="margin-bottom: 8px;">Riwayat Donasi</h1>
          <p style="font-size: 14px; color: var(--slate); margin: 0;">
            Jejak kebaikan Anda, tercatat dengan transparan. Pantau setiap donasi di sini.
          </p>
        </div>
        <a href="/donasi.html" class="btn btn-primary">+ Donasi Lagi</a>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <section style="background: var(--surface); padding: 40px 0;">
    <div class="container" style="max-width: 1100px;">
      <!-- Table Card -->
      <div class="card" style="padding: 0; overflow: hidden;">
        <!-- Toolbar -->
        <div style="
          padding: 16px 24px;
          border-bottom: 1px solid var(--border);
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 16px;
        ">
          <div style="display: flex; gap: 12px; flex-wrap: wrap;">
            <!-- Search input -->
            <div style="position: relative; width: 300px;">
              <svg style="
                position: absolute;
                left: 12px;
                top: 50%;
                transform: translateY(-50%);
                width: 16px;
                height: 16px;
                color: var(--slate-light);
                pointer-events: none;
              " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <input
                type="text"
                id="cari"
                placeholder="Cari nama panti atau nomor donasi"
                style="
                  width: 100%;
                  padding: 10px 12px 10px 36px;
                  border: 1px solid var(--border);
                  border-radius: var(--radius-md);
                  font-size: 13px;
                "
              />
            </div>

            <!-- Filter Status -->
            <select id="filter-status" style="padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 13px;">
              <option value="">Semua Status</option>
              <option value="menunggu">Menunggu</option>
              <option value="berhasil">Berhasil</option>
              <option value="gagal">Gagal</option>
            </select>

            <!-- Filter Tanggal -->
            <select id="filter-tanggal" style="padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 13px;">
              <option value="">Semua Tanggal</option>
              <option value="minggu">Minggu ini</option>
              <option value="bulan">Bulan ini</option>
              <option value="tahun">Tahun ini</option>
            </select>
          </div>
        </div>

        <!-- Table -->
        <div style="overflow-x: auto;">
          <table style="width: 100%; border-collapse: collapse;">
            <thead>
              <tr style="background: #F3F7FA; border-bottom: 1px solid var(--border);">
                <th style="
                  padding: 12px 16px;
                  text-align: left;
                  font-size: 12px;
                  font-weight: 600;
                  color: var(--slate);
                  letter-spacing: 0.5px;
                ">Tanggal</th>
                <th style="
                  padding: 12px 16px;
                  text-align: left;
                  font-size: 12px;
                  font-weight: 600;
                  color: var(--slate);
                  letter-spacing: 0.5px;
                ">Panti</th>
                <th style="
                  padding: 12px 16px;
                  text-align: left;
                  font-size: 12px;
                  font-weight: 600;
                  color: var(--slate);
                  letter-spacing: 0.5px;
                ">Nominal</th>
                <th style="
                  padding: 12px 16px;
                  text-align: left;
                  font-size: 12px;
                  font-weight: 600;
                  color: var(--slate);
                  letter-spacing: 0.5px;
                ">Status</th>
                <th style="
                  padding: 12px 16px;
                  text-align: left;
                  font-size: 12px;
                  font-weight: 600;
                  color: var(--slate);
                  letter-spacing: 0.5px;
                ">Detail</th>
              </tr>
            </thead>
            <tbody id="riwayat-body">
              <tr>
                <td colspan="5" style="padding: 40px; text-align: center; color: var(--slate-light); font-size: 13px;">
                  Memuat data riwayat donasi...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Pagination Footer -->
        <div style="
          padding: 16px 24px;
          border-top: 1px solid var(--border);
          display: flex;
          justify-content: space-between;
          align-items: center;
        ">
          <span id="pagination-info" style="font-size: 13px; color: var(--slate);">
            Menampilkan 1-10 dari 24 donasi
          </span>
          <div id="pagination-container" class="pagination" style="justify-content: flex-end;"></div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div class="footer-left">© 2026 SIDOTI. Bersama, hadirkan lebih banyak kebaikan.</div>
        <div class="footer-right">
          <a href="#" class="footer-link">Kebijakan Privasi</a>
          <a href="#" class="footer-link">Hubungi Kami</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/riwayat.js"></script>
</body>
</html>
